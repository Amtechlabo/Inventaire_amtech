<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#242736;--border:#2e3245;
  --accent:#4ade80;--accent2:#22d3ee;--accent3:#f472b6;

html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;font-size:14px}
.app{max-width:980px;margin:0 auto;padding:1rem}
.header{display:flex;align-items:center;justify-content:space-between;padding:1rem 0 1.5rem;border-bottom:1px solid var(--border);margin-bottom:1.5rem;flex-wrap:wrap;gap:10px}
.logo{font-family:var(--mono);font-size:20px;color:var(--accent);letter-spacing:-0.5px}
.logo span{color:var(--muted)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-left:8px;transition:background .3s}
.sync-dot.ok{background:var(--accent)}.sync-dot.error{background:var(--danger)}
.views{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:500;transition:all .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.active{background:rgba(74,222,128,.1);border-color:var(--accent);color:var(--accent)}
.btn-danger:hover{border-color:var(--danger)!important;color:var(--danger)!important}
.btn-primary{background:rgba(74,222,128,.15);border-color:var(--accent);color:var(--accent)}
.btn-primary:hover{background:rgba(74,222,128,.25)}
.btn-sm{padding:4px 10px;font-size:12px}
input,select{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-family:var(--font);font-size:13px;width:100%;outline:none;transition:border .15s}
input:focus,select:focus{border-color:var(--accent)}
select option{background:var(--bg3)}
.form-row{display:flex;gap:10px;margin-bottom:10px}
.form-col{flex:1;display:flex;flex-direction:column;gap:5px}

.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:13px;z-index:200;animation:fadeIn .2s;border-left:3px solid var(--accent)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.badge{padding:2px 8px;border-radius:4px;font-size:11px;font-family:var(--mono)}
.badge-low{background:rgba(248,113,113,.1);color:var(--danger);border:1px solid rgba(248,113,113,.2)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-family:var(--mono);background:rgba(34,211,238,.1);color:var(--accent2);border:1px solid rgba(34,211,238,.2)}
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:1.5rem}

.stat-val{font-size:22px;font-weight:600;font-family:var(--mono);color:var(--accent)}

.qty-btn:hover{border-color:var(--accent);color:var(--accent)}
.qty-val{font-family:var(--mono);font-size:13px;color:var(--accent);min-width:32px;text-align:center}
.url-display{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all;margin-top:8px}
.search-thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;flex-shrink:0;cursor:pointer}
.search-thumb-ph{width:44px;height:44px;border-radius:6px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;cursor:pointer}

/* ── Tree ── */
.tree-root{display:flex;flex-direction:column;gap:8px}
.node{border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--bg2)}
.node-header{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none;transition:background .15s}
.node-header:hover{background:rgba(255,255,255,.03)}
.node-toggle{font-size:11px;color:var(--muted);width:14px;flex-shrink:0;transition:transform .2s;display:inline-block}

.node-icon{font-size:18px;flex-shrink:0}
.node-name{font-weight:600;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-meta{font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.node-actions{display:flex;gap:5px;flex-shrink:0}
.node-body{border-top:1px solid var(--border);padding:10px 12px;display:none}
.node-body.open{display:block}
.node-children{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-left:16px;border-left:2px solid var(--border)}

/* article row inside node */

.art-row:last-child{border-bottom:none}

/* depth colors */
.node[data-depth="0"]{border-color:#2e3245}
.node[data-depth="1"]{border-color:#253040;background:#161924}

/* ── Drag & Drop ── */
.drag-handle{cursor:grab;color:var(--border);font-size:16px;padding:0 4px;flex-shrink:0;user-select:none;transition:color .15s;line-height:1}
.drag-handle:hover{color:var(--muted)}

.drop-root-zone.drag-over{border-color:var(--accent);color:var(--accent);background:rgba(74,222,128,.06)}

@media(max-width:600px){
  .form-row{flex-direction:column}

/* ── Login ── */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:340px;text-align:center}
.login-logo{font-family:var(--mono);font-size:26px;color:var(--accent);margin-bottom:6px}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:2rem}

<body>
<div class="app" id="root">
  <div style="text-align:center;padding:4rem"><span class="spinner"></span> Chargement...</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, collection, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const uid = () => Math.random().toString(36).slice(2,9);
const ICONS = {
  armoire:'🗄️', étagère:'📚', tiroir:'🗃️', carton:'📦',
  établi:'🔧', rack:'🖥️', caisse:'🧰', banette:'🗂️',
  étage:'📂', zone:'📌', autre:'📫'
};

function toast(msg,dur=2600){
  const t=document.createElement('div');
  t.className='toast';t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),dur);
}

let db;
// nodes: flat map id→node, each node has {id,name,icon,type,parentId,order,photoURL,pins:[],items:[]}
let nodes = {};
let openIds = new Set();
let currentView = 'tree';

// ── Auth ──────────────────────────────────────────────────────────────────────
function isAuthed(){
  const exp = localStorage.getItem('se_auth_exp');
  return exp && Date.now() < parseInt(exp);
}

function doLogin(){
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  if(user === AUTH_USER && pass === AUTH_PASS){
    localStorage.setItem('se_auth_exp', Date.now() + SESSION_DURATION);
    document.getElementById('login-screen').remove();
    bootApp();
  } else {
    document.getElementById('login-error').textContent = 'Identifiant ou mot de passe incorrect';
    document.getElementById('login-pass').value = '';
    document.getElementById('login-pass').focus();
  }
}

function doLogout(){
  localStorage.removeItem('se_auth_exp');
  location.reload();
}

function showLogin(){
  const div = document.createElement('div');
  div.id = 'login-screen';
  div.className = 'login-wrap';
  div.innerHTML = `
  <div class="login-box">
    <div class="login-logo">stock<span style="color:var(--muted)">.</span>elec</div>
    <div class="login-sub">⚡ Inventaire électronique</div>
    <div class="login-field">
      <label>Identifiant</label>
      <input id="login-user" type="text" placeholder="Identifiant" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
    </div>
    <div class="login-field">
      <label>Mot de passe</label>
      <input id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="login-error" id="login-error"></div>
    <button class="btn btn-primary" style="width:100%;padding:10px" onclick="doLogin()">Accéder →</button>
  </div>`;
  document.body.appendChild(div);
  document.getElementById('login-user').focus();
}

function bootApp(){
  initFirebase();
  setTimeout(checkQRParam, 800);
}

function initFirebase(){
  const app = initializeApp(FIREBASE_CONFIG);
  db = getFirestore(app);
  setSyncStatus('loading');
  onSnapshot(collection(db,'nodes'), snap => {
    nodes = {};
    snap.docs.forEach(d => { nodes[d.id] = {id:d.id,...d.data()}; });
    setSyncStatus('ok');
    render();
  }, ()=>setSyncStatus('error'));
}

function setSyncStatus(s){
  const d=document.getElementById('sync-dot');
  if(d){d.className='sync-dot '+s;}
}

async function saveNode(node){ await setDoc(doc(db,'nodes',node.id), node); }
async function deleteNode(id){
  // delete recursively
  const children = Object.values(nodes).filter(n=>n.parentId===id);
  for(const c of children) await deleteNode(c.id);
  await deleteDoc(doc(db,'nodes',id));
}

// ── Photo (base64) ────────────────────────────────────────────────────────────
function compressPhoto(file){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const MAX=1200; let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        res(canvas.toDataURL('image/jpeg',0.75));
      };
      img.onerror=rej; img.src=e.target.result;
    };
    reader.onerror=rej; reader.readAsDataURL(file);
  });
}

// ── Render ────────────────────────────────────────────────────────────────────
function showView(v){currentView=v;render();}

function render(){
  const root=document.getElementById('root');
  const allItems = Object.values(nodes).flatMap(n=>n.items||[]);
  const lowCount = Object.values(nodes).reduce((s,n)=>s+(n.items||[]).filter(i=>i.minQty&&i.qty<=i.minQty).length,0);
  root.innerHTML=`
  <div class="header">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="logo">stock<span>.</span>elec <span class="sync-dot" id="sync-dot"></span></div>
      <button class="btn btn-sm" onclick="doLogout()" title="Se déconnecter" style="font-size:11px;padding:4px 10px;color:var(--muted)">🔒 Déco</button>
    </div>
    <div class="views">
      <button class="btn ${currentView==='tree'?'active':''}" onclick="showView('tree')">📦 Inventaire</button>
      <button class="btn ${currentView==='search'?'active':''}" onclick="showView('search')">🔍 Recherche</button>
      <button class="btn ${currentView==='qrlist'?'active':''}" onclick="showView('qrlist')">📷 QR Codes</button>
      <button class="btn ${currentView==='rapport'?'active':''}" onclick="showView('rapport')">📋 Rapport</button>
    </div>
  </div>
  <div id="vc">${renderView(allItems,lowCount)}</div>`;
  setSyncStatus('ok');
}

function renderView(allItems,lowCount){
  if(currentView==='tree')   return renderTree(allItems,lowCount);
  if(currentView==='search') return renderSearch();
  if(currentView==='qrlist') return renderQRList();
  if(currentView==='rapport') return renderRapport();
  return '';
}

// ── Tree view ─────────────────────────────────────────────────────────────────
function renderTree(allItems,lowCount){
  const roots = Object.values(nodes).filter(n=>!n.parentId).sort((a,b)=>(a.order||0)-(b.order||0));
  const totalNodes = Object.keys(nodes).length;
  return `
  <div class="stats-bar">
    <div class="stat"><div class="stat-val">${totalNodes}</div><div class="stat-label">Emplacements</div></div>
    <div class="stat"><div class="stat-val">${allItems.length}</div><div class="stat-label">Références</div></div>
    <div class="stat"><div class="stat-val">${allItems.reduce((s,i)=>s+(i.qty||0),0)}</div><div class="stat-label">Articles total</div></div>
    <div class="stat"><div class="stat-val" style="color:${lowCount>0?'var(--danger)':'var(--accent)'}">${lowCount}</div><div class="stat-label">Stock bas</div></div>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:1rem">
    <button class="btn btn-primary" onclick="openAddNode(null)">+ Ajouter emplacement</button>
  </div>
  <div class="tree-root">
    ${roots.map(n=>renderNode(n,0)).join('')}
  </div>
  <div class="drop-root-zone ${Object.keys(nodes).length>0?'visible':''}" id="drop-root" ondragover="onDragOverRoot(event)" ondragleave="onDragLeaveRoot(event)" ondrop="onDropRoot(event)">
    Déposer ici pour mettre à la racine
  </div>
  ${totalNodes===0?'<div class="empty"><div style="font-size:40px;margin-bottom:1rem">📦</div><div>Aucun emplacement.<br>Créez votre premier stockage !</div></div>':''}`;
}

function renderNode(node,depth){
  const children = Object.values(nodes).filter(n=>n.parentId===node.id).sort((a,b)=>(a.order||0)-(b.order||0));
  const items = node.items||[];
  const pins = node.pins||[];
  const isOpen = openIds.has(node.id);
  const lowItems = items.filter(i=>i.minQty&&i.qty<=i.minQty);

  return `<div class="node" data-depth="${Math.min(depth,3)}" id="node-${node.id}">
  <div class="node-header" onclick="toggleNode('${node.id}')" ondragover="onDragOver(event,'${node.id}')" ondragleave="onDragLeave(event,'${node.id}')" ondrop="onDrop(event,'${node.id}')">
    <span class="drag-handle" draggable="true" onmousedown="event.stopPropagation()" ondragstart="onDragStart(event,'${node.id}')" ondragend="onDragEnd(event)" title="Déplacer" onclick="event.stopPropagation()">⠿</span>
    <span class="node-toggle ${isOpen?'open':''}">▶</span>
    <span class="node-icon">${node.icon}</span>
    <span class="node-name">${node.name}</span>
    <span class="node-meta">${items.length} art · ${children.length} sous</span>
    ${lowItems.length?`<span class="badge badge-low">⚠️${lowItems.length}</span>`:''}
    <div class="node-actions" onclick="event.stopPropagation()">
      <button class="btn btn-sm" onclick="openEditNode('${node.id}')" title="Renommer">✏️</button>
      <button class="btn btn-sm" onclick="openQR('${node.id}')" title="QR Code">QR</button>
      <button class="btn btn-sm btn-danger" onclick="confirmDeleteNode('${node.id}')" title="Supprimer">✕</button>
    </div>
  </div>
  <div class="node-body ${isOpen?'open':''}">
    <div class="node-toolbar">
      <button class="btn btn-sm btn-primary" onclick="openAddItem('${node.id}')">+ Article</button>
      <button class="btn btn-sm" onclick="openAddNode('${node.id}')">+ Sous-emplacement</button>
      <button class="btn btn-sm" onclick="openEditPhoto('${node.id}')">📷 ${node.photoURL?'Photo':'+ Photo'}</button>
    </div>

    ${node.photoURL?`
    <div class="photo-wrapper" id="pw-${node.id}">
      <img src="${node.photoURL}" id="pi-${node.id}" onclick="openPhotoZoom('${node.id}')" style="cursor:zoom-in">
      ${pins.map((p,i)=>p?`<div class="pin" style="left:${p.x}%;top:${p.y}%" onclick="event.stopPropagation();showPinDetail('${node.id}',${i})">${i+1}</div>`:``).join('')}
    </div>`:''}

    ${items.length>0?`<div style="margin-bottom:${children.length?'10px':'0'}">
      ${items.map((item,idx)=>{
        const pin=pins[idx];
        return `<div class="art-row">
          ${node.photoURL?`<span class="pin-indicator ${pin?'placed':'empty'}" onclick="startPin('${node.id}',${idx})" title="${pin?'Repositionner':'Placer sur photo'}">${pin?'●':'○'}</span>`:''}
          <div style="flex:1;min-width:0">
            <div class="art-name">${item.name}</div>
            <div class="art-meta">${item.ref||'—'} · ${item.unit||'pcs'}</div>
          </div>
          ${item.minQty&&item.qty<=item.minQty?`<span class="badge badge-low">bas</span>`:''}
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="changeQty('${node.id}','${item.id}',-1)">−</button>
            <span class="qty-val">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty('${node.id}','${item.id}',1)">+</button>
          </div>
          <button class="btn btn-sm btn-danger" onclick="confirmDeleteItem('${node.id}','${item.id}')">✕</button>
        </div>`;
      }).join('')}
    </div>`:''}

    ${children.length>0?`<div class="node-children">
      ${children.map(c=>renderNode(c,depth+1)).join('')}
    </div>`:''}

    ${items.length===0&&children.length===0?`<div style="color:var(--muted);font-size:12px;padding:4px 0">Vide — ajoutez des articles ou des sous-emplacements</div>`:''}
  </div>
</div>`;
}

function toggleNode(id){
  if(openIds.has(id)) openIds.delete(id); else openIds.add(id);
  render();
}

// ── Search ────────────────────────────────────────────────────────────────────
function renderSearch(){
  return `
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input id="search-input" placeholder="Chercher un article, une référence, un emplacement..." oninput="doSearch()" autofocus>
  </div>
  <div id="search-results" style="display:flex;flex-direction:column;gap:8px">
    <div class="empty">Tapez pour chercher</div>
  </div>`;
}

function doSearch(){
  const q=document.getElementById('search-input')?.value.toLowerCase().trim();
  const el=document.getElementById('search-results');
  if(!el)return;
  if(!q){el.innerHTML='<div class="empty">Tapez pour chercher</div>';return;}
  const results=[];
  Object.values(nodes).forEach(node=>{
    // match node name
    if(node.name.toLowerCase().includes(q)){
      results.push({type:'node',node});
    }
    // match items
    (node.items||[]).forEach((item,idx)=>{
      if(item.name.toLowerCase().includes(q)||(item.ref||'').toLowerCase().includes(q)){
        results.push({type:'item',node,item,idx});
      }
    });
  });
  if(!results.length){el.innerHTML=`<div class="empty">Aucun résultat pour <b>${q}</b></div>`;return;}

  el.innerHTML=results.map(r=>{
    if(r.type==='node') return `
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer" onclick="goToNode('${r.node.id}')">
      ${r.node.photoURL?`<img class="search-thumb" src="${r.node.photoURL}">`:`<div class="search-thumb-ph">${r.node.icon}</div>`}
      <div style="flex:1">
        <div style="font-weight:600">${r.node.name}</div>
        <div style="font-size:11px;color:var(--muted)">${r.node.type} · ${(r.node.items||[]).length} article(s)</div>
      </div>
      <span class="tag">emplacement</span>
    </div>`;
    const pin=(r.node.pins||[])[r.idx];
    return `
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px">
      ${r.node.photoURL?`<img class="search-thumb" src="${r.node.photoURL}" onclick="goToNode('${r.node.id}')" style="cursor:pointer">`:`<div class="search-thumb-ph" onclick="goToNode('${r.node.id}')" style="cursor:pointer">${r.node.icon}</div>`}
      <div style="flex:1;min-width:0">
        <div style="font-weight:500;font-size:13px">${r.item.name}</div>
        <div style="font-size:11px;color:var(--muted)">
          <span style="color:var(--accent2);cursor:pointer" onclick="goToNode('${r.node.id}')">${r.node.icon} ${r.node.name}</span>
          · ${r.item.ref||'—'} · ${r.item.unit||'pcs'}${pin?' · 📍':''}
        </div>
      </div>
      ${r.item.minQty&&r.item.qty<=r.item.minQty?`<span class="badge badge-low">bas</span>`:''}
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="changeQty('${r.node.id}','${r.item.id}',-1)">−</button>
        <span class="qty-val">${r.item.qty}</span>
        <button class="qty-btn" onclick="changeQty('${r.node.id}','${r.item.id}',1)">+</button>
      </div>
    </div>`;
  }).join('');
}

function goToNode(id){
  // open all ancestors
  let n=nodes[id];
  while(n){openIds.add(n.id);n=nodes[n.parentId];}
  currentView='tree';
  render();
  setTimeout(()=>{
    const el=document.getElementById('node-'+id);
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  },100);
}


// ── Rapport / Inventaire total ────────────────────────────────────────────────
function getNodePath(nodeId){
  const parts=[];
  let n=nodes[nodeId];
  while(n){parts.unshift(n.name);n=nodes[n.parentId];}
  return parts.join(' › ');
}

function renderRapport(){
  // Build flat list of all items with location path
  const rows=[];
  Object.values(nodes).forEach(node=>{
    const path=getNodePath(node.id);
    (node.items||[]).forEach(item=>{
      rows.push({item,path,node});
    });
  });
  // sort by name
  rows.sort((a,b)=>a.item.name.localeCompare(b.item.name));
  const low=rows.filter(r=>r.item.minQty&&r.item.qty<=r.item.minQty);

  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px">
    <div>
      <div style="font-size:16px;font-weight:600">📋 Inventaire total</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px">${rows.length} référence(s) · ${rows.reduce((s,r)=>s+(r.item.qty||0),0)} articles au total</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm" onclick="exportCSV()">⬇️ CSV</button>
      <button class="btn btn-sm btn-primary" onclick="printRapport()">🖨️ Imprimer</button>
    </div>
  </div>

  ${low.length?`<div style="background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--danger);margin-bottom:1rem">
    ⚠️ ${low.length} article(s) en stock bas : ${low.map(r=>r.item.name).join(', ')}
  </div>`:''}

  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden">
    <div style="display:grid;grid-template-columns:1fr 80px 120px 1fr;gap:0;background:var(--bg3);padding:8px 14px;font-size:11px;font-weight:600;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px">
      <div>Article</div><div style="text-align:center">Qté</div><div>Réf.</div><div>Emplacement</div>
    </div>
    ${rows.length===0?'<div class="empty">Aucun article dans l\'inventaire</div>':''}
    ${rows.map((r,i)=>`
    <div style="display:grid;grid-template-columns:1fr 80px 120px 1fr;gap:0;padding:8px 14px;font-size:13px;border-top:1px solid var(--border);background:${i%2===0?'transparent':'rgba(255,255,255,.01)'};${r.item.minQty&&r.item.qty<=r.item.minQty?'border-left:3px solid var(--danger);':''}" onclick="goToNode('${r.node.id}');showView('tree')" style="cursor:pointer">
      <div style="font-weight:500;cursor:pointer" title="Voir dans l'inventaire">${r.item.name}${r.item.minQty&&r.item.qty<=r.item.minQty?` <span class="badge badge-low">bas</span>`:''}</div>
      <div style="text-align:center;font-family:var(--mono);color:${r.item.qty===0?'var(--danger)':r.item.minQty&&r.item.qty<=r.item.minQty?'var(--danger)':'var(--accent)'}">${r.item.qty}</div>
      <div style="font-family:var(--mono);font-size:11px;color:var(--muted)">${r.item.ref||'—'}</div>
      <div style="font-size:12px;color:var(--accent2);cursor:pointer" onclick="event.stopPropagation();goToNode('${r.node.id}');showView('tree')">${r.path}</div>
    </div>`).join('')}
  </div>`;
}

function exportCSV(){
  const rows=[];
  Object.values(nodes).forEach(node=>{
    const path=getNodePath(node.id);
    (node.items||[]).forEach(item=>{
      rows.push([item.name, item.qty, item.unit||'pcs', item.ref||'', path]);
    });
  });
  rows.sort((a,b)=>a[0].localeCompare(b[0]));
  const header=['Article','Quantité','Unité','Référence','Emplacement'];
  const csv=[header,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`inventaire_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast('⬇️ Export CSV téléchargé');
}

// selected QR ids for batch print
let qrSelected = new Set();
let qrCopies = {}; // nodeId -> number of copies

function renderQRList(){
  const all=Object.values(nodes).sort((a,b)=>(a.order||0)-(b.order||0));
  const baseUrl = window.location.href.split('?')[0];
  const perRow = [2,3,4];
  return `
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:1rem">
    <div>
      <div style="font-size:16px;font-weight:600">📷 QR Codes</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px">${all.length} emplacement(s) · <span id="qr-sel-count">${qrSelected.size}</span> sélectionné(s)</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-sm" onclick="qrSelectAll()">Tout sélectionner</button>
      <button class="btn btn-sm" onclick="qrSelectNone()">Tout désélectionner</button>
      <select id="qr-per-row" style="width:auto;padding:6px 10px;font-size:13px">

        <option value="3" selected>3 par ligne</option>
        <option value="4">4 par ligne</option>
      </select>
      <select id="qr-size" style="width:auto;padding:6px 10px;font-size:13px">
        <option value="120">Petit (120px)</option>
        <option value="160" selected>Moyen (160px)</option>
        <option value="220">Grand (220px)</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="printQRBatch()" ${qrSelected.size===0?'disabled style="opacity:.5;cursor:not-allowed"':''}>🖨️ Imprimer (${qrSelected.size})</button>
    </div>
  </div>

  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden">
    ${all.length===0?'<div class="empty">Aucun emplacement</div>':''}
    ${all.map(node=>{
      const sel = qrSelected.has(node.id);
      return `
    <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;background:${sel?'rgba(74,222,128,.06)':''};transition:background .15s" onclick="toggleQRSelect('${node.id}')">
      <input type="checkbox" ${sel?'checked':''} onclick="event.stopPropagation();toggleQRSelect('${node.id}')" style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0">
      ${node.photoURL?`<img class="search-thumb" src="${node.photoURL}" loading="lazy">`:`<div class="search-thumb-ph">${node.icon}</div>`}
      <div style="flex:1;min-width:0">
        <div style="font-weight:500">${node.name}</div>
        <div style="font-size:11px;color:var(--muted)">${getNodePath(node.id)} · ${(node.items||[]).length} article(s)</div>
      </div>
      ${sel?`<div style="display:flex;align-items:center;gap:4px;flex-shrink:0" onclick="event.stopPropagation()">
        <button class="qty-btn" onclick="changeQRCopies('${node.id}',-1)">−</button>
        <input id="copies-${node.id}" type="number" min="1" max="99" value="${qrCopies[node.id]||1}" onchange="setQRCopies('${node.id}',this.value)" style="width:42px;text-align:center;padding:4px 6px;font-size:13px">
        <button class="qty-btn" onclick="changeQRCopies('${node.id}',1)">+</button>
        <span style="font-size:11px;color:var(--muted);margin-left:2px">ex.</span>
      </div>`:''}
      <button class="btn btn-sm" onclick="event.stopPropagation();openQR('${node.id}')" title="Aperçu QR">👁</button>
    </div>`;
    }).join('')}
  </div>`;
}

function toggleQRSelect(id){
  if(qrSelected.has(id)){
    qrSelected.delete(id);
    delete qrCopies[id];
  } else {
    qrSelected.add(id);
    qrCopies[id] = qrCopies[id]||1;
  }
  document.getElementById('vc').innerHTML = renderQRList();
}

function setQRCopies(id, val){
  const n = Math.max(1, Math.min(99, parseInt(val)||1));
  qrCopies[id] = n;
  const inp = document.getElementById('copies-'+id);
  if(inp) inp.value = n;
}

function changeQRCopies(id, delta){
  const current = qrCopies[id]||1;
  setQRCopies(id, current + delta);
}

function qrSelectAll(){
  Object.keys(nodes).forEach(id=>{
    qrSelected.add(id);
    if(!qrCopies[id]) qrCopies[id]=1;
  });
  document.getElementById('vc').innerHTML = renderQRList();
}

function qrSelectNone(){
  qrSelected.clear();
  qrCopies = {};
  document.getElementById('vc').innerHTML = renderQRList();
}

function printQRBatch(){
  if(qrSelected.size===0) return;
  const perRow = parseInt(document.getElementById('qr-per-row')?.value||3);
  const size   = parseInt(document.getElementById('qr-size')?.value||160);
  const baseUrl = window.location.href.split('?')[0];
  const selected = Object.values(nodes)
    .filter(n=>qrSelected.has(n.id))
    .sort((a,b)=>getNodePath(a.id).localeCompare(getNodePath(b.id)));

  const cellW = Math.floor(100/perRow);
  const date = new Date().toLocaleDateString('fr-FR');

  const cells = selected.flatMap(node=>{
    const url = baseUrl+'?node='+node.id;
    const path = getNodePath(node.id);
    const copies = qrCopies[node.id]||1;
    const cell = `<div class="qr-cell">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=${size*2}x${size*2}&data=${encodeURIComponent(url)}&margin=6" width="${size}" height="${size}">
      <div class="qr-name">${node.icon} ${node.name}</div>
      ${path!==node.name?`<div class="qr-path">${path}</div>`:''}
      <div class="qr-url">${url}</div>
    </div>`;
    return Array(copies).fill(cell);
  }).join('');

  const w = window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><title>QR Codes — stock.elec</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',sans-serif;background:#fff;color:#111;padding:1cm}
  h1{font-size:14px;color:#666;margin-bottom:12px;border-bottom:1px solid #ddd;padding-bottom:8px}
  .grid{display:flex;flex-wrap:wrap;gap:12px}
  .qr-cell{width:calc(${cellW}% - 8px);border:1.5px solid #ddd;border-radius:8px;padding:12px;text-align:center;page-break-inside:avoid;display:flex;flex-direction:column;align-items:center;gap:4px}
  .qr-cell img{border-radius:4px;display:block}
  .qr-name{font-size:12px;font-weight:600;margin-top:6px;word-break:break-word}
  .qr-path{font-size:10px;color:#888;word-break:break-word}
  .qr-url{font-size:9px;color:#aaa;word-break:break-all;margin-top:2px}
  @media print{
    body{padding:.5cm}
    @page{margin:.5cm}
  }
</style></head><body>
<h1>⚡ stock.elec — QR Codes · ${selected.length} emplacement(s) · ${date}</h1>
<div class="grid">${cells}</div>
<script>window.onload=()=>setTimeout(()=>window.print(),800)<\/script>
</body></html>`);
  w.document.close();
  toast(`🖨️ Impression de ${selected.length} QR code(s)...`);
}

async function addNode(parentId){
  const name=document.getElementById('nn-name').value.trim();
  const type=document.getElementById('nn-type').value;
  if(!name)return;
  const id=uid();
  let photoURL='';
  const pf=document.getElementById('nn-photo')?.files[0];
  document.querySelector('.modal-backdrop')?.remove();
  if(pf){toast('📷 Compression...');photoURL=await compressPhoto(pf);}
  const node={id,name,icon:ICONS[type],type,parentId:parentId||null,items:[],pins:[],photoURL,order:Date.now()};
  await saveNode(node);
  openIds.add(id);
  if(parentId)openIds.add(parentId);
  toast('✅ Créé !');
}

// ── Add item modal ────────────────────────────────────────────────────────────
function openAddItem(nodeId){
  const node=nodes[nodeId];
  const m=document.createElement('div');
  m.className='modal-backdrop';
  m.innerHTML=`
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">Article dans "${node.name}"</div>
    <div class="form-col" style="margin-bottom:10px"><label>Nom *</label><input id="ai-name" placeholder="ex: Arduino Uno, Relais 5V..."></div>
    <div class="form-row">
      <div class="form-col"><label>Référence</label><input id="ai-ref" placeholder="ARD-UNO"></div>
      <div class="form-col"><label>Unité</label><input id="ai-unit" value="pcs" placeholder="pcs, m..."></div>
    </div>
    <div class="form-row">
      <div class="form-col"><label>Quantité</label><input id="ai-qty" type="number" value="1" min="0"></div>
      <div class="form-col"><label>Seuil alerte</label><input id="ai-min" type="number" placeholder="0" min="0"></div>

async function addItem(nodeId){
  const name=document.getElementById('ai-name').value.trim();
  if(!name)return;
  const node=nodes[nodeId];
  const items=[...(node.items||[])];
  const existing=items.find(i=>i.name.toLowerCase()===name.toLowerCase());
  if(existing){existing.qty+=parseInt(document.getElementById('ai-qty').value)||0;}
  else{items.push({id:uid(),name,ref:document.getElementById('ai-ref').value.trim(),unit:document.getElementById('ai-unit').value.trim()||'pcs',qty:parseInt(document.getElementById('ai-qty').value)||0,minQty:parseInt(document.getElementById('ai-min').value)||0});}
  document.querySelector('.modal-backdrop')?.remove();
  await saveNode({...node,items});
  toast('✅ Article ajouté');
}

async function changeQty(nodeId,itemId,delta){
  const node=nodes[nodeId];
  const items=(node.items||[]).map(i=>i.id===itemId?{...i,qty:Math.max(0,i.qty+delta)}:i);
  await saveNode({...node,items});
}

function confirmDeleteNode(id){
  const node=nodes[id];
  const childCount=Object.values(nodes).filter(n=>n.parentId===id).length;
  const msg=childCount>0
    ?`Supprimer "${node.name}" et tous ses sous-emplacements (${childCount}) ?`
    :`Supprimer "${node.name}" et ses ${(node.items||[]).length} articles ?`;
  if(!confirm(msg))return;
  deleteNode(id).then(()=>toast('🗑️ Supprimé'));
}

function confirmDeleteItem(nodeId,itemId){
  const node=nodes[nodeId];
  const item=(node.items||[]).find(i=>i.id===itemId);
  if(!confirm(`Supprimer "${item.name}" ?`))return;
  const items=(node.items||[]).filter(i=>i.id!==itemId);
  saveNode({...node,items}).then(()=>toast('🗑️ Supprimé'));
}

async function handlePhotoUpload(nodeId,input){

async function deletePhoto(nodeId){
  const node=nodes[nodeId];
  await saveNode({...node,photoURL:'',pins:[]});
  toast('🗑️ Photo supprimée');
}

function openPhotoZoom(nodeId){
  const node=nodes[nodeId];

function startPin(nodeId,itemIdx){
  const node=nodes[nodeId];
  const item=(node.items||[])[itemIdx];
  const img=document.getElementById(`pi-${nodeId}`);
  if(!img){toast('Pas de photo !');return;}
  toast(`📍 Cliquez sur la photo pour placer "${item.name}"`);
  img.style.cursor='crosshair';img.style.outline='2px solid var(--accent)';img.style.borderRadius='8px';
  const handler=async(e)=>{
    img.removeEventListener('click',handler);
    img.style.cursor='zoom-in';img.style.outline='';
    const rect=img.getBoundingClientRect();
    const x=parseFloat(((e.clientX-rect.left)/rect.width*100).toFixed(1));
    const y=parseFloat(((e.clientY-rect.top)/rect.height*100).toFixed(1));
    const pins=[...(node.pins||[])];
    while(pins.length<=itemIdx)pins.push(null);
    pins[itemIdx]={x,y,label:item.name};
    await saveNode({...node,pins});
    toast(`✅ "${item.name}" placé !`);
  };
  img.addEventListener('click',handler);
}

// ── Drag & Drop ──────────────────────────────────────────────────────────────
let dragId = null;
let autoOpenTimer = null;
let autoOpenTarget = null;
let currentDragOver = null;

function onDragStart(e, id){
  dragId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  setTimeout(()=>{
    const el = document.getElementById('node-'+id);
    if(el) el.classList.add('dragging');
    const rootZone = document.getElementById('drop-root');
    if(rootZone) rootZone.classList.add('visible');
  }, 0);
}

function onDragEnd(e){
  clearTimeout(autoOpenTimer);
  autoOpenTarget = null;
  currentDragOver = null;
  if(dragId){
    const el = document.getElementById('node-'+dragId);
    if(el) el.classList.remove('dragging');
  }
  document.querySelectorAll('.node-header.drag-over').forEach(el=>el.classList.remove('drag-over'));
  const rootZone = document.getElementById('drop-root');
  if(rootZone){ rootZone.classList.remove('drag-over','visible'); }
  dragId = null;
}

function onDragOver(e, targetId){
  if(!dragId || dragId === targetId) return;
  if(isDescendant(targetId, dragId)) return;
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = 'move';
  if(currentDragOver !== targetId){
    document.querySelectorAll('.node-header.drag-over').forEach(el=>el.classList.remove('drag-over'));
    currentDragOver = targetId;
    e.currentTarget.classList.add('drag-over');
    // auto-open closed nodes
    if(autoOpenTarget !== targetId){
      clearTimeout(autoOpenTimer);
      autoOpenTarget = targetId;
      if(!openIds.has(targetId)){
        autoOpenTimer = setTimeout(()=>{ openIds.add(targetId); render(); }, 700);
      }
    }
  }
}

function onDragLeave(e, targetId){
  e.stopPropagation();
  if(!e.currentTarget.contains(e.relatedTarget)){
    e.currentTarget.classList.remove('drag-over');
    if(currentDragOver === targetId) currentDragOver = null;
    clearTimeout(autoOpenTimer);
    autoOpenTarget = null;
  }
}

function onDragOverRoot(e){
  if(!dragId) return;
  e.preventDefault();
  document.querySelectorAll('.node-header.drag-over').forEach(el=>el.classList.remove('drag-over'));
  document.getElementById('drop-root')?.classList.add('drag-over');
}

function onDragLeaveRoot(e){
  document.getElementById('drop-root')?.classList.remove('drag-over');
}

async function onDrop(e, targetId){
  e.preventDefault();
  e.stopPropagation();
  clearTimeout(autoOpenTimer);
  if(!dragId || dragId === targetId) return;
  if(isDescendant(targetId, dragId)) return;
  document.querySelectorAll('.node-header.drag-over').forEach(el=>el.classList.remove('drag-over'));
  const node = nodes[dragId];
  const targetName = nodes[targetId]?.name;
  if(!node) return;
  openIds.add(targetId);
  await saveNode({...node, parentId: targetId, order: Date.now()});
  toast(`✅ "${node.name}" déplacé dans "${targetName}"`);
  dragId = null;
}

async function onDropRoot(e){
  e.preventDefault();
  clearTimeout(autoOpenTimer);
  if(!dragId) return;
  document.getElementById('drop-root')?.classList.remove('drag-over');
  const node = nodes[dragId];
  if(!node) return;
  await saveNode({...node, parentId: null, order: Date.now()});
  toast(`✅ "${node.name}" déplacé à la racine`);
  dragId = null;
}

function isDescendant(potentialChild, ancestorId){
  let n = nodes[potentialChild];
  while(n && n.parentId){
    if(n.parentId === ancestorId) return true;
    n = nodes[n.parentId];
  }
  return false;
}
